name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release etiketi (örn. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Jar'i dogrula ve paketle
        run: ./build.sh

      - name: Jar'i artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: realisticworld-jar
          path: dist/*.jar

      - name: GitHub Release olustur
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          # workflow_dispatch'te etiket henuz yoksa gh onu $GITHUB_SHA uzerinde olusturur
          gh release create "$TAG" dist/*.jar \
            --target "$GITHUB_SHA" \
            --title "Gerçekçi Dünya $TAG — Minecraft 26.2 (Fabric)" \
            --notes-file .github/release-notes.md
