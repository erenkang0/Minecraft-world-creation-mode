name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Jar'i dogrula ve paketle
        run: ./build.sh

      - name: Jar'i artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: realisticworld-jar
          path: dist/*.jar

      - name: GitHub Release olustur
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.jar \
            --title "Gerçekçi Dünya $GITHUB_REF_NAME — Minecraft 26.2 (Fabric)" \
            --notes-file .github/release-notes.md
